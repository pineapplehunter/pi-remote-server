name: Build OCI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4

      # Tests also run on pull requests; use the shared cache read-only.
      - uses: Mic92/niks3-action@53fc4d8be8e7f3693e1a6be91eede40590b0d1d2 # v1.12.0
        with:
          server-url: https://niks3.s.ihavenojob.work
          skip-push: 'true'

      - name: Test and type-check
        run: |
          nix develop --command bash -euo pipefail -c '
            make css
            go test -race ./...
            go vet ./...
            bun install --frozen-lockfile
            bun test
            bun run typecheck
            cd pi-extension
            npm ci --ignore-scripts
            npm run typecheck
            npm test
          '

      - name: Build server and Pi extension packages
        run: nix build .#server .#pi-extension --no-link

  build-image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4

      - uses: Mic92/niks3-action@53fc4d8be8e7f3693e1a6be91eede40590b0d1d2 # v1.12.0
        with:
          server-url: https://niks3.s.ihavenojob.work

      - name: Build image
        run: nix build

      - name: Load image to Docker
        run: ./result | docker load

      - name: Smoke-test container
        run: |
          scratch=$(mktemp -d)
          trap 'docker rm -f pi-remote-smoke >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          mkdir "$scratch/socket" "$scratch/state"
          docker run --detach --name pi-remote-smoke \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1::3000 \
            --env PI_REMOTE_TICKET_SOCKET=/run/pi-remote-agent/ticket.sock \
            --env PI_REMOTE_DB=/var/lib/pi-remote/hosts.sqlite \
            --mount "type=bind,src=$scratch/state,dst=/var/lib/pi-remote" \
            --mount "type=bind,src=$scratch/socket,dst=/run/pi-remote-agent" \
            pi-remote-server:latest
          url="http://$(docker port pi-remote-smoke 3000/tcp)"
          for _ in {1..30}; do
            if curl --fail --silent "$url/" > /dev/null; then break; fi
            sleep 1
          done
          docker logs pi-remote-smoke
          curl --fail --silent --show-error "$url/" | grep -q 'Pi remote'
          curl --fail --silent --show-error "$url/favicon.svg" | grep -q '<svg'
          curl --fail --silent --show-error "$url/public/app.js" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/agent/ws")" = 404
          test "$(curl --silent --unix-socket "$scratch/socket/ticket.sock" --output /dev/null --write-out '%{http_code}' http://localhost/agent/ws)" = 401
          # Catch accidental runtime/dependency closure growth (uncompressed layers).
          size=$(docker image inspect pi-remote-server:latest --format '{{.Size}}')
          echo "Image size: $size bytes"
          # SSH/SQLite gateway with CGO: ~58.4 MB of uncompressed layers on amd64.
          test "$size" -lt 70000000

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Upload image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker image tag pi-remote-server:latest "$image"
          docker push "$image"
